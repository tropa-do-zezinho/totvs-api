name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myuser -d mydatabase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: ci-postgres-only
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode verify

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag totvs-api:ci .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: totvs-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve registry
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          suffix="${SUBSCRIPTION_ID//-/}"
          echo "ACR_NAME=acrtotvs${suffix:0:12}" >> "$GITHUB_ENV"
      - name: Build and push immutable image
        run: |
          set -euo pipefail
          image="$ACR_NAME.azurecr.io/totvs-api:$GITHUB_SHA"
          az acr login --name "$ACR_NAME"
          docker build --tag "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Publish Container Apps revision
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes
          az containerapp update --name ca-totvs-api --resource-group rg-totvs-prod --image "$IMAGE"
          az containerapp show --name ca-totvs-api --resource-group rg-totvs-prod --query "{revision:properties.latestRevisionName,status:properties.provisioningState}" --output json
