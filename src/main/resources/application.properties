spring.application.name=api-totvs

spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update

# HS256 requires >= 256 bits (32+ characters)
jwt.secret=${JWT_SECRET:fiap-totvs-api-jwt-secret-key-change-me-in-production-2026}
jwt.expiration=86400000

# Docker Compose (SQL Server + Service Bus emulator can take a while)
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.readiness.timeout=240s

# ---------------------------------------------------------------------------
# Azure Blob Storage (Azurite local defaults — override via env in production)
# Well-known Azurite account: devstoreaccount1
# ---------------------------------------------------------------------------
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}
azure.storage.account-key=${AZURE_STORAGE_ACCOUNT_KEY:}
azure.storage.endpoint=${AZURE_STORAGE_ACCOUNT_ENDPOINT:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:reunioes}
azure.storage.sas-expiry-hours=${AZURE_STORAGE_SAS_EXPIRY_HOURS:24}

# ---------------------------------------------------------------------------
# Azure Service Bus emulator (AMQP on host port 5673 — RabbitMQ keeps 5672)
# SharedAccessKey "SAS_KEY_VALUE" is the official emulator placeholder key
# ---------------------------------------------------------------------------
azure.servicebus.connection-string=${AZURE_SERVICE_BUS_CONNECTION_STRING:Endpoint=sb://localhost:5673;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
azure.servicebus.queue-name=${AZURE_SERVICE_BUS_QUEUE_NAME:meet-process}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Allow large insights payloads from the Worker (~10MB+ as per contract)
server.tomcat.max-http-form-post-size=15MB
server.tomcat.max-swallow-size=15MB
